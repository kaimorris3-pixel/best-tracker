<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101d2a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-180.png">
  <title>B.E.S.T. — Exercise Tracker</title>
  <style>
    :root{color-scheme:dark;--bg:#09131d;--panel:#122333;--panel2:#172b3d;--line:#294156;--text:#edf4f7;--muted:#a0b3c1;--lime:#c8f36a;--blue:#6fc4f2;--red:#ff8e8e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom))}header{padding:22px 18px 12px;max-width:780px;margin:auto}.brand{color:var(--lime);font-size:12px;font-weight:900;letter-spacing:.16em}.top{display:flex;align-items:end;justify-content:space-between;gap:12px}h1{font-size:29px;line-height:1.1;margin:5px 0 4px}header p{color:var(--muted);margin:0;font-size:14px}.container{max-width:780px;margin:auto;padding:0 16px 28px}.tabs{display:flex;gap:8px;overflow:auto;padding:8px 0 12px;position:sticky;top:0;background:var(--bg);z-index:3}.tab{border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);padding:10px 14px;font-weight:800;white-space:nowrap}.tab.active{background:var(--lime);border-color:var(--lime);color:#18230c}.page{display:none}.page.active{display:block}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0 14px}.card h2{font-size:18px;margin:0 0 10px}.card h3{font-size:14px;margin:4px 0;color:var(--lime)}.muted{color:var(--muted)}.small{font-size:12px;color:var(--muted)}.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{background:var(--panel2);border-radius:14px;padding:13px}.metric b{display:block;font-size:22px}.metric span{color:var(--muted);font-size:12px}.field{margin:10px 0}.field label{display:block;font-weight:750;font-size:13px;color:#c6d4dc;margin:0 0 5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:11px;background:#0b1925;color:var(--text);padding:12px;font:inherit;min-height:46px}.field textarea{min-height:80px;resize:vertical}.btn{border:0;border-radius:12px;background:var(--lime);color:#17210c;padding:12px 15px;font-weight:900;font:inherit;cursor:pointer}.btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.btn.danger{background:#44292d;color:#ffdada}.btn.full{width:100%}.exercise{padding:12px;background:var(--panel2);border-radius:13px;margin:8px 0}.exercise-head{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:800}.exercise-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}.exercise-grid input{width:100%;padding:10px 8px;background:#0b1925;color:var(--text);border:1px solid var(--line);border-radius:9px}.entry{padding:12px 0;border-top:1px solid var(--line)}.entry:first-of-type{border-top:0}.entry-title{font-weight:850}.entry-detail{white-space:pre-line;color:var(--muted);font-size:13px;margin-top:3px}.badge{display:inline-block;background:#30441c;color:var(--lime);border-radius:999px;padding:3px 8px;font-size:11px;font-weight:900;margin-left:6px}.timer{font-size:38px;font-variant-numeric:tabular-nums;font-weight:900;text-align:center;color:var(--lime);padding:4px}.photo{width:100%;height:auto;max-height:440px;object-fit:cover;border-radius:12px}.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.footer{position:fixed;bottom:0;left:0;right:0;padding:10px 18px calc(10px + env(safe-area-inset-bottom));background:#0e1e2c;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:11px;z-index:4}.hidden{display:none!important}dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:18px;padding:18px;width:min(92vw,380px)}dialog::backdrop{background:rgba(0,0,0,.6)}dialog h2{font-size:18px;margin:0 0 6px}dialog .btn{margin-top:10px}@media(min-width:620px){.tabs{position:static}.container{padding-top:4px}.photo-grid{grid-template-columns:repeat(3,1fr)}}
  </style>
</head>
<body>
  <header><div class="top"><div><div class="brand">B.E.S.T.</div><h1>Exercise Tracker</h1><p id="todayLabel"></p></div><button class="btn secondary" id="backupBtn" type="button">Backup</button></div></header>
  <main class="container">
    <nav class="tabs" aria-label="Sections"><button class="tab active" data-page="home">Today</button><button class="tab" data-page="lift">Strength</button><button class="tab" data-page="rides">Peloton</button><button class="tab" data-page="progress">Progress</button><button class="tab" data-page="history">History & PRs</button></nav>
    <section class="page active" id="page-home"></section>
    <section class="page" id="page-lift"></section>
    <section class="page" id="page-rides"></section>
    <section class="page" id="page-progress"></section>
    <section class="page" id="page-history"></section>
  </main>
  <div class="footer">Workout records stay on this device · Calorie totals refresh from Kai’s Daily Bites</div>
  <dialog id="backupDialog" aria-labelledby="backupTitle"><h2 id="backupTitle">Backup</h2><p class="small">A backup includes workouts, rides, measurements, and photos. Restoring replaces everything on this device.</p><button class="btn full" id="exportBackup" type="button">Export a backup</button><button class="btn secondary full" id="restoreBackup" type="button">Restore from a backup file</button><button class="btn secondary full" id="closeBackup" type="button">Cancel</button></dialog>
  <input id="restoreFile" class="hidden" type="file" accept="application/json,.json">
  <script src="app.js"></script>
</body>
</html>
